services:
  backend:
    image: robot-arm:latest
    command: >
      uvicorn backend.app.server:app
      --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Berlin
    restart: unless-stopped

  frontend:
    image: robot-arm:latest
    command: >
      streamlit run frontend/app.py
      --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: "http://backend:8000"
      STREAMLIT_SERVER_RUNNING: "1"
      TZ: Europe/Berlin
    depends_on:
      - backend
    restart: unless-stopped
